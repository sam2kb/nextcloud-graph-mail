name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSER_IMAGE: composer@sha256:a5f59b9fd2faf31218632be4809dc6491761085e8064c31dc3b84378c48c248b
      PHP_IMAGE: php@sha256:628102249d93494233b54490b785f12db9cd60f4dc89416dfca15973f2125f10
      NEXTCLOUD_IMAGE: nextcloud@sha256:786c102155d2717ba0f53a62b3fdd7a1354edc48e800b94dbe32294d9a5752a2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked development tools
        run: >-
          docker run --rm -v "$PWD:/app" -w /app
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/app
          "$COMPOSER_IMAGE" install --no-interaction --prefer-dist --no-progress --no-plugins --no-scripts
      - name: PHP style and unit tests
        run: |
          docker run --rm --network none -v "$PWD:/app" -w /app --entrypoint php "$PHP_IMAGE" vendor/bin/php-cs-fixer fix --config=tools/php-cs-fixer.php --dry-run --show-progress=none
          docker run --rm --network none -v "$PWD:/app" -w /app --entrypoint php "$PHP_IMAGE" vendor/bin/phpunit
      - name: Application package
        run: |
          python3 tests/test_package.py
          python3 tools/package.py
      - name: Disposable Nextcloud integration
        run: |
          docker run -d --name graph-mail-ci --network none -e NEXTCLOUD_ADMIN_USER=fixture_admin -e NEXTCLOUD_ADMIN_PASSWORD="$(cat /proc/sys/kernel/random/uuid)" -e SQLITE_DATABASE=fixture -v "$PWD:/var/www/html/custom_apps/graph_mail" "$NEXTCLOUD_IMAGE"
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec -u www-data graph-mail-ci php occ status --output=json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("installed") else 1)' 2>/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          docker exec -u www-data graph-mail-ci php occ app:enable graph_mail
          docker exec -u www-data -e NEXTCLOUD_TEST_ROOT=/var/www/html graph-mail-ci php custom_apps/graph_mail/vendor/bin/phpunit -c custom_apps/graph_mail/phpunit.xml
      - name: Remove disposable fixture
        if: always()
        run: docker rm -f -v graph-mail-ci 2>/dev/null || true
